<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zorgax · MyZubster AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#090b14;color:#f7f8fb;min-height:100vh}.app{max-width:980px;margin:0 auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;gap:14px;align-items:center}.orb{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8b4fe,#7c3aed 45%,#0ea5e9 78%,#111827);box-shadow:0 0 34px rgba(124,58,237,.55)}h1{margin:0;font-size:24px}.sub{color:#9ca3af;font-size:13px;margin-top:4px}.badge{padding:7px 11px;border:1px solid #334155;border-radius:999px;color:#c4b5fd;font-size:12px}.panel{background:#111522;border:1px solid #232a3a;border-radius:18px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;margin-bottom:14px}select,textarea,button{font:inherit}select,textarea{background:#0b0e18;color:#fff;border:1px solid #30384a;border-radius:12px;padding:12px;width:100%}label span{display:block;font-size:12px;color:#9ca3af;margin-bottom:6px}.web-toggle{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid #30384a;border-radius:12px;background:#0b0e18}.web-toggle span{margin:0;color:#dbeafe;font-weight:700}.web-toggle small{margin-left:auto;color:#64748b}.chat{height:58vh;min-height:420px;overflow-y:auto;padding:18px}.msg{max-width:82%;padding:14px 16px;border-radius:16px;line-height:1.5;margin:0 0 14px;white-space:pre-wrap}.ai{background:#151a2b;border:1px solid #2c3550}.user{margin-left:auto;background:linear-gradient(135deg,#6d28d9,#0369a1)}.meta{font-size:11px;color:#94a3b8;margin-bottom:6px}.sourcebox{max-width:92%;padding:14px 16px;border-radius:16px;background:#0b2130;border:1px solid #155e75;margin:0 0 14px}.sourcebox strong{display:block;margin-bottom:8px}.sourcebox a{display:block;color:#7dd3fc;text-decoration:none;margin:7px 0;overflow-wrap:anywhere}.sourcebox a:hover{text-decoration:underline}.composer{padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.composer textarea{min-height:72px;resize:vertical}.send{border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#0284c7);color:#fff;font-weight:700;padding:0 22px;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;color:#64748b;margin-top:10px;text-align:center}.error{color:#fca5a5}@media(max-width:700px){.app{padding:12px}.controls{grid-template-columns:1fr}.chat{height:62vh}.msg{max-width:94%}.composer{grid-template-columns:1fr}.send{padding:14px}.web-toggle small{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="brand"><div class="orb" aria-hidden="true"></div><div><h1>Zorgax</h1><div class="sub">ZORGAX-001 · IA interattiva pubblica MyZubster</div></div></div>
      <div class="badge" id="status">● connessione</div>
    </div>

    <section class="panel controls">
      <label><span>Modalità</span><select id="mode"><option>Assistente</option><option>Creativo</option><option>Studio</option><option>Tecnico</option><option>Eco / MyZubster</option></select></label>
      <label><span>Stile</span><select id="tone"><option>Chiaro</option><option>Amichevole</option><option>Sintetico</option><option>Visionario</option></select></label>
      <label class="web-toggle"><input id="webSearch" type="checkbox" checked><span>Web live + fonti esterne</span><small>ricerca read-only con citazioni</small></label>
    </section>

    <section class="panel chat" id="chat" aria-live="polite">
      <div class="msg ai"><div class="meta">ZORGAX</div>Ciao. Sono Zorgax, l'IA pubblica del progetto MyZubster. Posso cercare fonti esterne, confrontarle e citarle nella risposta. Non serve un account per iniziare.</div>
    </section>

    <section class="panel composer">
      <textarea id="input" placeholder="Scrivi a Zorgax..."></textarea>
      <button class="send" id="send">Invia</button>
    </section>
    <div class="hint" id="transportHint">Connessione: verifica in corso…</div>
  </main>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),statusEl=document.getElementById('status'),mode=document.getElementById('mode'),tone=document.getElementById('tone'),webSearch=document.getElementById('webSearch'),transportHint=document.getElementById('transportHint');
const history=[];
const SAME_ORIGIN_CHAT='/api/zargox/chat';
const DIRECT_GATEWAY_CHAT='https://myzubster-gateway.vercel.app/api/zargox';
const DIRECT_GATEWAY_STATUS='https://myzubster-gateway.vercel.app/api/zargox';
function add(text,type,label){const el=document.createElement('div');el.className='msg '+type;const m=document.createElement('div');m.className='meta';m.textContent=label;el.appendChild(m);el.appendChild(document.createTextNode(text));chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
function renderSources(data){const sources=Array.isArray(data.external_sources)?data.external_sources:(Array.isArray(data.live_sources)?data.live_sources:[]);if(!sources.length)return;const box=document.createElement('div');box.className='sourcebox';const heading=document.createElement('strong');heading.textContent='Fonti esterne consultate';box.appendChild(heading);sources.forEach(source=>{if(!source||!source.url)return;const link=document.createElement('a');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='['+(source.label||'?')+'] '+(source.title||source.url)+' · '+(source.provider||'web');box.appendChild(link)});chat.appendChild(box);chat.scrollTop=chat.scrollHeight}
async function parseResponse(response){const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):{}}catch{throw new Error('Risposta non JSON (HTTP '+response.status+'): '+raw.slice(0,180))}if(!response.ok||!data.ok)throw new Error((data&&data.error)||('HTTP '+response.status));return data}
async function postChat(url,payload,timeoutMs=45000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});return await parseResponse(response)}finally{clearTimeout(timer)}}
async function requestChat(payload){try{const data=await postChat(SAME_ORIGIN_CHAT,payload);transportHint.textContent='Connessione: proxy MyZubster attivo';return data}catch(primaryError){console.warn('Zargox same-origin transport failed:',primaryError);transportHint.textContent='Connessione: proxy non disponibile, uso gateway diretto';try{return await postChat(DIRECT_GATEWAY_CHAT,payload)}catch(fallbackError){const message='Proxy: '+primaryError.message+' | Gateway: '+fallbackError.message;throw new Error(message)}}}
async function probe(){try{const response=await fetch(DIRECT_GATEWAY_STATUS,{cache:'no-store'});const data=await parseResponse(response);if(data.configured===false){statusEl.textContent='● configurazione richiesta';transportHint.textContent='DeepSeek non configurato: manca DEEPSEEK_API_KEY nell’ambiente server';send.disabled=true;input.disabled=true;input.placeholder='Zorgax sarà disponibile dopo la configurazione DeepSeek';return}statusEl.textContent='● online';const web=data.web_search||{};transportHint.textContent='AI: '+(data.model||'disponibile')+' · web: '+(web.general_provider||'Wikipedia/GDELT fallback')}catch(error){statusEl.textContent='● offline';transportHint.textContent='Connessione AI non disponibile: '+error.message}}
async function ask(){const text=input.value.trim();if(!text||send.disabled)return;add(text,'user','TU');history.push({role:'user',content:text});input.value='';send.disabled=true;statusEl.textContent='● pensa';const wait=add('Sto cercando e verificando le fonti...','ai','ZORGAX');try{const d=await requestChat({message:text,history:history.slice(-12),mode:mode.value,tone:tone.value,useWeb:webSearch.checked});wait.remove();add(d.response,'ai','ZORGAX · '+(d.model||'AI'));renderSources(d);history.push({role:'assistant',content:d.response});statusEl.textContent='● online'}catch(e){wait.remove();const detail=e.name==='AbortError'?'Timeout della richiesta AI':e.message;add('Errore di connessione: '+detail,'ai error','ZORGAX');statusEl.textContent='● errore'}finally{send.disabled=false;input.focus()}}
send.addEventListener('click',ask);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});probe();input.focus();
</script>
</body>
</html>
